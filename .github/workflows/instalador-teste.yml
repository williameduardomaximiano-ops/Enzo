name: Instalador de teste COSMO
# Gera o instalador do Windows para testes, sem publicar release (o atualizador não o vê).
# Roda em commits com "[instalador]" na mensagem ou manualmente pela aba Actions.
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalador:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[instalador]')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: npm ci
      - name: Testes
        run: npm test
      - name: Cache do runtime (Python, voz e reconhecimento)
        uses: actions/cache@v4
        with:
          path: |
            resources
            .build-wheels
          key: runtime-${{ hashFiles('resources-lock.json', 'voice/requirements-windows.txt') }}
      - name: Preparar runtime do Windows
        run: python scripts/prepare-runtime.py
      - name: Gerar instalador
        run: npm run build:win
      # GitHub Releases nao usa a cota de Actions Artifacts.
      # PRERELEASE de teste: nao cria manifesto do atualizador e nao se confunde com versao estavel.
      - name: Publicar instalador de teste no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/ENZO-*-Windows-x64.exe)
          if [ "${#files[@]}" -ne 1 ]; then echo '::error::Esperado exatamente um instalador .exe'; exit 1; fi
          sha256sum "${files[0]}" > "${files[0]}.sha256"
          TAG="teste-windows11-${GITHUB_SHA:0:12}"
          gh release create "$TAG" "${files[0]}" "${files[0]}.sha256" \
            --prerelease --title "COSMO Windows 11 (teste ${GITHUB_SHA:0:12})" \
            --notes 'Instalador de TESTE, nao validado em PC real. Base 0.2.1; nao representa a versao 0.2.2 nem inclui confirmacao de API publica nova. Nao distribuido pelo atualizador automatico.' \
            --target "$GITHUB_SHA"
