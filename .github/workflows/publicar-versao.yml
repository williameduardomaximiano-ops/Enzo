name: Publicar versão COSMO
# Ao enviar uma tag vX.Y.Z: testa, gera o instalador no Windows, assina o manifesto e publica o release
# que o atualizador do app (updater/github-private.cjs) consulta.
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Conferir versão, notas e chave
        env:
          ENZO_SIGNING_KEY: ${{ secrets.ENZO_SIGNING_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG" ]; then echo "::error::A tag $GITHUB_REF_NAME não bate com package.json ($PKG)."; exit 1; fi
          if [ ! -s "release-notes/v$VERSION.md" ]; then echo "::error::Faltam as notas em release-notes/v$VERSION.md."; exit 1; fi
          if [ -z "$ENZO_SIGNING_KEY" ]; then echo "::error::Segredo ENZO_SIGNING_KEY não configurado (Settings → Secrets and variables → Actions)."; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Cache do runtime (Python, voz e reconhecimento)
        uses: actions/cache@v4
        with:
          path: |
            resources
            .build-wheels
          key: runtime-${{ hashFiles('resources-lock.json', 'voice/requirements-windows.txt') }}

      - name: Preparar runtime do Windows
        run: python scripts/prepare-runtime.py

      - name: Gerar instalador
        run: npm run build:win

      - name: Assinar manifesto
        env:
          ENZO_SIGNING_KEY: ${{ secrets.ENZO_SIGNING_KEY }}
        run: node scripts/sign-github-release.cjs "dist/ENZO-$VERSION-Windows-x64.exe" "$VERSION" "release-notes/v$VERSION.md" enzo-update.json

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/ENZO-$VERSION-Windows-x64.exe" enzo-update.json \
            --title "COSMO $VERSION" --notes-file "release-notes/v$VERSION.md" --verify-tag
