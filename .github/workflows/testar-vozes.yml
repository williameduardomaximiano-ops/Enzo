name: COSMO — identidade, vozes, avatares e widgets
on:
  push:
    branches: ['feature/vozes-masculinas-015', 'feature/cosmo-rename']
    paths:
      - 'core/voice-catalog.cjs'
      - 'core/assistant-identity.cjs'
      - 'core/intent.cjs'
      - 'core/mode-intents.cjs'
      - 'core/llm.cjs'
      - 'core/modes.cjs'
      - 'core/workmode.cjs'
      - 'android/**'
      - 'package.json'
      - 'scripts/installer.nsi'
      - 'core/avatar-presets.cjs'
      - 'core/dashboard-metrics.cjs'
      - 'core/local-calendar.cjs'
      - 'voice/worker.py'
      - 'ui/**'
      - 'desktop/**'
      - 'tests/voice-catalog.test.cjs'
      - 'tests/avatar-presets.test.cjs'
      - 'tests/cosmo-identity.test.cjs'
      - 'tests/dashboard-metrics.test.cjs'
      - 'tests/local-calendar.test.cjs'
      - '.github/workflows/testar-vozes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checar sintaxe, vozes e avatares
        run: |
          node --check core/assistant-identity.cjs
          node --check core/intent.cjs
          node --check core/mode-intents.cjs
          node --check core/voice-catalog.cjs
          node --check core/avatar-presets.cjs
          node --check core/dashboard-metrics.cjs
          node --check core/local-calendar.cjs
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          python -m py_compile voice/worker.py
          node --test tests/voice-catalog.test.cjs tests/avatar-presets.test.cjs tests/dashboard-metrics.test.cjs tests/local-calendar.test.cjs tests/cosmo-identity.test.cjs
      - name: Verificar montagem da interface
        run: |
          npm ci
          npm run bundle
