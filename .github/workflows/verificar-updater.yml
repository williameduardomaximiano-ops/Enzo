name: Validar updater ENZO
on:
  push:
    paths:
      - 'updater/**'
      - 'tests/**'
      - '.github/workflows/verificar-updater.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de atualizador
        run: node --test tests/github-private.test.cjs
