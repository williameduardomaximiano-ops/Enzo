<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1423"><title>ENZO • Android</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1423;color:#dbeafa;font:16px system-ui;padding:28px;max-width:680px;margin:auto}h1{letter-spacing:8px;color:#83e8ec}p{line-height:1.6;color:#92abc6}input,textarea,button{width:100%;font:inherit;border-radius:12px;padding:15px;margin:8px 0;border:1px solid #2a455d;background:#14283b;color:#e7f3ff}button{background:#80e0e4;color:#082632;font-weight:700}article{background:#142739;border-radius:12px;padding:16px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#849bb4}#status{color:#ffcea3}label{display:block}button:disabled{opacity:.4}</style><h1>ENZO</h1><p>Seu assistente. Conectado ao seu computador.</p><div id="pair"><label for="code">Código exibido no PC</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="off"><button id="connect">Conectar</button><small>Confirme o pareamento no computador. Use apenas seu Wi-Fi privado.</small></div><div id="chat" hidden><div id="messages" role="log"></div><label for="text">Mensagem para o ENZO</label><textarea id="text" placeholder="Digite ou use o microfone do teclado Android." maxlength="4000"></textarea><button id="send">Enviar</button><button id="disconnect">Desconectar</button></div><p id="status" role="status"></p><script>
let token=sessionStorage.getItem('enzo-token');const $=x=>document.getElementById(x);function show(){ $('pair').hidden=!!token;$('chat').hidden=!token;}async function call(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(data)});const result=await r.json();if(!r.ok){if(r.status===401){token=null;sessionStorage.removeItem('enzo-token');show();}throw Error(result.error)}return result}function message(t){const a=document.createElement('article');a.textContent=t;$('messages').append(a)}$('connect').onclick=async()=>{try{$('connect').disabled=true;$('status').textContent='Confirme no computador…';const r=await call('/pair',{code:$('code').value.trim()});token=r.token;sessionStorage.setItem('enzo-token',token);$('status').textContent='Conectado por até 1 hora.';show()}catch(e){$('status').textContent=e.message}finally{$('connect').disabled=false}};$('send').onclick=async()=>{const text=$('text').value.trim();if(!text)return;$('send').disabled=true;message('Você: '+text);$('text').value='';$('status').textContent='ENZO está processando…';try{const r=await call('/command',{text});message('ENZO: '+r.say);$('status').textContent=''}catch(e){$('status').textContent=e.message}finally{$('send').disabled=false}};$('disconnect').onclick=()=>{token=null;sessionStorage.removeItem('enzo-token');show();};show();
</script></html>
